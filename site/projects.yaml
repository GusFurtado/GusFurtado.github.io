# Cards da seção Projetos, em dois grupos. URLs sem "http" são relativas à raiz do site.
# tagline: a frase curta embaixo do card, em cada idioma; com a identidade dos apps
# padronizada, só o nome não diferencia os projetos. Bem curta, uma linha no desktop.
#
# packages: o fundo de cada card é assets/img/projects/<id>.svg e o título é texto
# (HTML), estilizado em assets/style.css pela classe project--<id>.
#
# apps: cada card segue o banner do README do app: a cena da classe (rpg-icons) em
# assets/img/projects/<id>-banner.webp, o ícone em <id>-icon.webp e o nome em texto,
# com a primeira parte na cor da lua e a segunda (em <em>) no destaque da classe.
# As cores ficam em assets/style.css (project--<id>).

packages:
  - id: dab
    name: Dados Abertos Brasil
    url: https://www.gustavofurtado.com/DadosAbertosBrasil/
    title: Dados<br>Abertos<br>Brasil
    tagline:
      en: Brazil's open government data in Python
      pt: Dados abertos do governo em Python

  - id: gender-guesser-br
    name: Gender Guesser Brasil
    url: https://www.gustavofurtado.com/gender-guesser-br/
    title: gender<em>guesser</em><small>BR</small>
    tagline:
      en: Gender of names from the IBGE Census
      pt: Gênero de nomes pelo Censo do IBGE

  - id: statsjunk
    name: statsjunk
    url: https://www.gustavofurtado.com/statsjunk/
    title: stats<em>junk</em>
    tagline:
      en: Statistical odds and ends in Python
      pt: Funções estatísticas avulsas em Python

  - id: cellmate
    name: Cellmate
    url: https://www.gustavofurtado.com/cellmate/
    title: Cellmate
    tagline:
      en: Styled Excel spreadsheets
      pt: Planilhas do Excel formatadas

apps:
  - id: simulancer
    name: SimuLancer
    url: https://www.gustavofurtado.com/SimuLancer/
    title: Simu<em>Lancer</em>
    tagline:
      en: Discrete event simulation with YAML models
      pt: Simulação de eventos discretos com modelos em YAML

  - id: paperanger
    name: PapeRanger
    url: https://www.gustavofurtado.com/PapeRanger/
    title: Pape<em>Ranger</em>
    tagline:
      en: A home for your household's paperwork
