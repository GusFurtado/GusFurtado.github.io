        degree: "Mestrado"
        pdf: documents/artigos/UFSC.pdf
        area: Engenharia de Produção e Pesquisa Operacional
        start_date: 2015-03
        end_date: 2017-02
        location: Florianópolis
        site: Otimização baseada em simulação.
        highlights:
          - "Orientador: Dr. Nelson Casarotto Filho"
          - "Dissertação: Procedimento para Análise de Sistemas de Produção Compartilhada Utilizando Otimização Baseada em Simulação"
      - institution: Universidade do Estado de Santa Catarina
        degree: "Bacharelado"
        pdf: documents/artigos/UDESC.pdf
        area: Engenharia de Produção e Sistemas
        start_date: 2009-01
        end_date: 2013-12
        location: Joinville
        site: Viabilidade econômica em manutenção produtiva.
        highlights:
