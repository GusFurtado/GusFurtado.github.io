cv:
  name: Gustavo Furtado da Silva
  headline: Data Scientist
  email: gustavofurtado2@gmail.com
  website: https://www.gustavofurtado.com/
  social_networks:
    - network: LinkedIn
      username: gustavo-furtado
    - network: GitHub
      username: GusFurtado
  sections:
    Summary:
      - Data scientist focused on end-to-end data pipelines (ingestion, ETL, data quality and orchestration) that feed machine learning models and analytics. Currently in R&D at Samsung Research Brazil; previously spent eight years at Ypê bringing pipelines, machine learning and simulation to manufacturing and sales. M.Sc. in Production Engineering and Operations Research from the Federal University of Santa Catarina. Python, SQL, Spark, Databricks, Airflow and dbt.
    Professional Experience:
      - company: Samsung Research Brazil
        position: Data Science R&D Specialist
        start_date: 2025-02
        end_date: present
        location: Campinas
        site: Clinical data pipelines and data science for healthcare R&D.
        highlights:
          - Clinical data engineering and data science for healthcare R&D projects, building data pipelines (ETL) that prepare and validate clinical data for machine learning models.
          - Integrated pipelines with workflow orchestrators, focusing on data quality, lineage and reproducibility.
          - Member of internal data architecture and infrastructure committees, contributing to data standards and data governance.
      - company: Ypê
        position: Senior Big Data and Data Science Analyst
        start_date: 2021-06
        end_date: 2025-01
        location: Amparo
        site: Data pipelines and machine learning with Spark, Databricks, Airflow and dbt.
        highlights:
          - Implemented scalable pipelines with Spark, Databricks, Airflow and dbt, reducing report generation time from one week to just a few hours and enabling real-time analytics.
          - Developed machine learning models using Scikit-Learn and TensorFlow for revenue optimization, customer segmentation, product classification, and indicator forecasting, enabling faster and more accurate business decisions.
          - Designed and managed a PostgreSQL database on Azure Cloud, centralizing strategic information and ensuring improved data accessibility and reliability.
      - company: Ypê
        position: Manufacturing Data Analyst
        start_date: 2018-10
        end_date: 2021-06
        location: Amparo
        site: Flask web apps for production and logistics data.
        highlights:
          - Developed web apps in Flask with Python and SQL Server for logistics and production data visualization and analysis, including monitoring fleet cycles and routes via GPS coordinates, optimizing times and routes.
          - Supported goal management and KPIs by automating routines and training the team in visual management and daily practices.
          - Participated in Industry 4.0 conferences and worked with suppliers to implement technologies such as intelligent dashboards, using simulations to validate new projects.
      - company: Ypê
        position: Industrial Simulation Analyst
        start_date: 2017-12
        end_date: 2018-10
        location: Amparo
        site: Factory simulation and production optimization.
        highlights:
          - Created process simulation models for new factories, production lines, and inventory optimization, providing data-driven insights for strategic capacity expansion decisions.
          - Developed nonlinear programming models for optimizing production plans, maximizing resource usage, and reducing operational costs.
          - Managed and analyzed industrial KPIs to generate strategic insights for senior management.
      - company: Wetzel S/A
        position: Process Engineering Intern
        start_date: 2011-03
        end_date: 2013-03
        location: Joinville
        site: Time studies and process improvement.
        highlights:
          - Conducted time studies and improved manufacturing processes.
          - Developed tools to increase productivity.
          - Conducted economic feasibility analyses for new processes.
    Education:
      - institution: Federal University of Santa Catarina
        degree: "Master's"
        area: Production Engineering and Operations Research
        start_date: 2015-03
        end_date: 2017-02
        location: Florianópolis
        site: Simulation-based optimization.
        highlights:
          - "Advisor: Dr. Nelson Casarotto Filho"
          - "Thesis: Procedure for Analyzing Shared Production Systems Using Simulation-Based Optimization"
      - institution: State University of Santa Catarina
        degree: "Bachelor's"
        area: Production Engineering and Systems
        start_date: 2009-01
        end_date: 2013-12
        location: Joinville
        site: Economic feasibility in productive maintenance.
        highlights:
          - "Advisor: Dr. Evandro Bittencourt"
          - "Final Project: Economic Feasibility Analysis for Acquiring Monitoring Software for Productive Maintenance Activities of Aluminum Injection Molding Machines"
    Projects:
      - name: "[Dados Abertos Brasil](https://www.gustavofurtado.com/dab/index.html)"
        summary: Open-source Python package, with over 190,000 downloads, that simplifies access to Brazilian government open data and APIs, such as IBGE and IPEA.
    Awards:
      - SIMEP 2017 Award for Best Operations Research Paper
      - "Advanced English: TOEFL iBT Certified"
    Data Stack:
      - label: Languages and Databases
        details: Python, SQL, PySpark, Pandas, PostgreSQL, SQL Server
      - label: Data Engineering
        details: Data Pipelines, ETL/ELT, Airflow, dbt, Spark, Databricks, Data Lakehouse, Data Quality, Data Governance
      - label: Cloud and DevOps
        details: Azure, Docker, Git, GitHub Actions, CI/CD
      - label: Machine Learning and AI
        details: Scikit-learn, TensorFlow, XGBoost, statsmodels, MLOps, Generative AI, LLMs
      - label: Web Apps and Dashboards
        details: Flask, FastAPI, Plotly
    Publications:
      - title: "Simulation-Based Analysis of Shared Manufacturing Systems"
        authors:
          - "**Gustavo Furtado da Silva**"
          - Nelson Casarotto Filho
          - Enzo Morosini Frazzon
        journal: "Gestão & Produção, 27(1)"
        date: 2020-03
        doi: 10.1590/0104-530X3718-20
      - title: "Métodos de Simulação-Otimização Aplicados a Internalização de Processos Produtivos"
        authors:
          - "**Gustavo Furtado da Silva**"
          - Nelson Casarotto Filho
        journal: "5th Production Engineering Symposium (SIMEP)"
        date: 2017-05
      - title: "Simulation-Based Analysis of “One Product Integrated Manufacturing” Systems"
        authors:
          - "**Gustavo Furtado da Silva**"
          - Enzo Morosini Frazzon
          - Nelson Casarotto Filho
        journal: "9th International Symposium on Industrial Engineering"
        date: 2016-10
      - title: "A Proposal for a Simulation-Optimization Method to Support Decision-Making in the Internalization of Production Processes"
        authors:
          - "**Gustavo Furtado da Silva**"
          - Enzo Morosini Frazzon
          - Nelson Casarotto Filho
        journal: "Exacta, 13(3)"
        date: 2015-10
        doi: 10.5585/ExactaEP.v13n3.5967
      - title: "Análise de Viabilidade Financeira para a Aquisição de um Software de Monitoramento das Atividades de Manutenção Produtiva de Injetoras de Alumínio"
